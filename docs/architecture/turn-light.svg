<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1216 612" role="img" aria-label="One supporter turn: Analyzer, depth ladder, Strategist, Generator, Critic, conformal gate, reply and memory update" xmlns="http://www.w3.org/2000/svg" width="1216" height="612"><rect x="0" y="0" width="1216" height="612" rx="12" style="fill:#ffffff"></rect><defs><marker id="turn-mk" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:#7b8696;stroke:none"></path></marker></defs>
    <rect x="16" y="16" width="1184" height="44" rx="8" style="fill:#e4e8ef;stroke:#d3d9e2;stroke-width:1px"></rect><text x="608" y="43" text-anchor="middle" style="fill:#18202c;stroke:none;font-size:13px;font-weight:600;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Every agent sees the whole conversation (verbatim) and the memory brief (at most 320 tokens)</text><path d="M188 60V96" marker-end="url(#turn-mk)" style="fill:none;stroke:#7b8696;stroke-width:1.3px"></path><path d="M608 60V96" marker-end="url(#turn-mk)" style="fill:none;stroke:#7b8696;stroke-width:1.3px"></path><path d="M1028 60V96" marker-end="url(#turn-mk)" style="fill:none;stroke:#7b8696;stroke-width:1.3px"></path><path d="M360 143H436" marker-end="url(#turn-mk)" style="fill:none;stroke:#7b8696;stroke-width:1.3px"></path><path d="M780 143H856" marker-end="url(#turn-mk)" style="fill:none;stroke:#7b8696;stroke-width:1.3px"></path><path d="M1028 190V240" marker-end="url(#turn-mk)" style="fill:none;stroke:#7b8696;stroke-width:1.3px"></path><path d="M296 319V370" marker-end="url(#turn-mk)" style="fill:none;stroke:#7b8696;stroke-width:1.3px"></path><path d="M576 424H640" marker-end="url(#turn-mk)" style="fill:none;stroke:#7b8696;stroke-width:1.3px"></path><path d="M920 370V319" marker-end="url(#turn-mk)" style="fill:none;stroke:#7b8696;stroke-width:1.3px;stroke-dasharray:4px, 4px"></path><path d="M820 479V524" marker-end="url(#turn-mk)" style="fill:none;stroke:#7b8696;stroke-width:1.3px"></path><path d="M640 550H576" marker-end="url(#turn-mk)" style="fill:none;stroke:#7b8696;stroke-width:1.3px"></path><path d="M16 150H8V550H16" marker-end="url(#turn-mk)" style="fill:none;stroke:#7b8696;stroke-width:1.3px;stroke-dasharray:4px, 4px"></path><g><rect x="16" y="96" width="344" height="94" rx="8" style="fill:#f2f1f8;stroke:#6a62b5;stroke-width:1.4px"></rect><text x="28" y="116" style="fill:#18202c;stroke:none;font-size:13px;font-weight:600;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Analyzer</text><text x="28" y="133" style="fill:#4a5568;stroke:none;font-size:11.5px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">reads the feeling and the needs behind it; every</text><text x="28" y="148" style="fill:#4a5568;stroke:none;font-size:11.5px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">claim must carry the seeker's own quote, and a</text><text x="28" y="163" style="fill:#4a5568;stroke:none;font-size:11.5px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">quote not found verbatim is dropped (confidence 0)</text><text x="28" y="178" style="fill:#4a5568;stroke:none;font-size:11.5px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">its reading also updates memory after the turn</text></g><g><rect x="436" y="96" width="344" height="94" rx="8" style="fill:#f2f1f8;stroke:#6a62b5;stroke-width:1.4px"></rect><text x="448" y="116" style="fill:#18202c;stroke:none;font-size:13px;font-weight:600;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Depth ladder (code)</text><text x="448" y="133" style="fill:#4a5568;stroke:none;font-size:11.5px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">L0 reflect · L1 explore · L2 tentative guess ·</text><text x="448" y="148" style="fill:#4a5568;stroke:none;font-size:11.5px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">L3 name the need. Analyzer confidence under</text><text x="448" y="163" style="fill:#4a5568;stroke:none;font-size:11.5px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">0.45 caps it at L1; L3 needs a confirmed</text><text x="448" y="178" style="fill:#4a5568;stroke:none;font-size:11.5px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">best guess in memory, else at most L2</text></g><g><rect x="856" y="96" width="344" height="94" rx="8" style="fill:#f2f1f8;stroke:#6a62b5;stroke-width:1.4px"></rect><text x="868" y="116" style="fill:#18202c;stroke:none;font-size:13px;font-weight:600;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Strategist</text><text x="868" y="133" style="fill:#4a5568;stroke:none;font-size:11.5px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">picks the move for this turn within the cap:</text><text x="868" y="148" style="fill:#4a5568;stroke:none;font-size:11.5px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">a plan in words and the rung it asks for;</text><text x="868" y="163" style="fill:#4a5568;stroke:none;font-size:11.5px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">the plan is the Generator's instruction</text><text x="868" y="178" style="fill:#4a5568;stroke:none;font-size:11.5px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">for this turn</text></g><g><rect x="16" y="240" width="1184" height="79" rx="8" style="fill:#faf4ea;stroke:#c3841a;stroke-width:1.4px"></rect><text x="28" y="260" style="fill:#18202c;stroke:none;font-size:13px;font-weight:600;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Generator: fine-tuned Qwen2.5-7B in the full system (step 12), the base model in cells A–D</text><text x="28" y="277" style="fill:#4a5568;stroke:none;font-size:11.5px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">gets the plan, the rung and the brief; the fine-tuned model writes its own analysis and strategy first, then the reply. Only the reply goes on.</text><text x="28" y="292" style="fill:#4a5568;stroke:none;font-size:11.5px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">On a revision it also gets the Critic's note and must stay at or below the rung.</text></g><g><rect x="16" y="370" width="560" height="109" rx="8" style="fill:#f2f1f8;stroke:#6a62b5;stroke-width:1.4px"></rect><text x="28" y="390" style="fill:#18202c;stroke:none;font-size:13px;font-weight:600;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Critic (the model, then code checks)</text><text x="28" y="407" style="fill:#4a5568;stroke:none;font-size:11.5px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">the model scores the 7 intrusiveness items (1 to 7) and the draft's rung</text><text x="28" y="422" style="fill:#4a5568;stroke:none;font-size:11.5px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">code checks: a claim without a seeker quote, a denied</text><text x="28" y="437" style="fill:#4a5568;stroke:none;font-size:11.5px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">guess repeated, a dormant or resolved need raised,</text><text x="28" y="452" style="fill:#4a5568;stroke:none;font-size:11.5px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">unsolicited advice, deeper than the cap</text><text x="28" y="467" style="fill:#4a5568;stroke:none;font-size:11.5px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">both combine into one risk score for the draft</text></g><g><rect x="640" y="370" width="560" height="109" rx="8" style="fill:#f9edef;stroke:#c03a4a;stroke-width:1.4px"></rect><text x="652" y="390" style="fill:#18202c;stroke:none;font-size:13px;font-weight:600;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Conformal gate</text><text x="652" y="407" style="fill:#4a5568;stroke:none;font-size:11.5px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">release when risk ≤ λ̂ and no denied guess is repeated</text><text x="652" y="422" style="fill:#4a5568;stroke:none;font-size:11.5px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">otherwise revise with the Critic's note, at most 2 times</text><text x="652" y="437" style="fill:#4a5568;stroke:none;font-size:11.5px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">still over after 2 revisions: a safe reflective reply</text><text x="652" y="452" style="fill:#4a5568;stroke:none;font-size:11.5px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">λ̂ from held-out conversations: 0.20 for the untuned agents,</text><text x="652" y="467" style="fill:#4a5568;stroke:none;font-size:11.5px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">0.425 for the fine-tuned Generator</text></g><g><rect x="16" y="524" width="560" height="52" rx="8" style="fill:#ebf4f2;stroke:#1d8a6b;stroke-width:1.4px"></rect><text x="28" y="544" style="fill:#18202c;stroke:none;font-size:13px;font-weight:600;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Memory update</text><text x="28" y="561" style="fill:#4a5568;stroke:none;font-size:11.5px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">the Analyzer's grounded claims are written after the reply is chosen</text></g><g><rect x="640" y="524" width="560" height="52" rx="8" style="fill:#f3f4f6;stroke:#7b8696;stroke-width:1.4px"></rect><text x="652" y="544" style="fill:#18202c;stroke:none;font-size:13px;font-weight:600;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Reply to the seeker</text><text x="652" y="561" style="fill:#4a5568;stroke:none;font-size:11.5px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">released, revised or fallback; analysis and strategy stay internal</text></g><text x="398" y="136" text-anchor="middle" style="fill:#7b8696;stroke:none;font-size:11px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">confidence</text><text x="818" y="136" text-anchor="middle" style="fill:#7b8696;stroke:none;font-size:11px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">cap</text><text x="1036" y="220" text-anchor="start" style="fill:#7b8696;stroke:none;font-size:11px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">plan + rung</text><text x="304" y="350" text-anchor="start" style="fill:#7b8696;stroke:none;font-size:11px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">draft</text><text x="608" y="416" text-anchor="middle" style="fill:#7b8696;stroke:none;font-size:11px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">risk</text><text x="928" y="350" text-anchor="start" style="fill:#7b8696;stroke:none;font-size:11px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">revise with the note, ≤ 2×</text><text x="828" y="506" text-anchor="start" style="fill:#7b8696;stroke:none;font-size:11px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">release</text><text x="608" y="542" text-anchor="middle" style="fill:#7b8696;stroke:none;font-size:11px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">then</text><text x="16" y="600" text-anchor="start" style="fill:#7b8696;stroke:none;font-size:11px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Ablation cells: A and B replace the four agents with one model call; A and C turn the gate off. The monolithic SFT arms run the Generator alone.</text></svg>
