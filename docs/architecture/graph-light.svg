<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1160 380" role="img" aria-label="Example need-state graph with every status" xmlns="http://www.w3.org/2000/svg" width="1160" height="380"><rect x="0" y="0" width="1160" height="380" rx="12" style="fill:#ffffff"></rect><defs><marker id="graph-mk" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:#7b8696;stroke:none"></path></marker><marker id="graph-mk-best" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:#2c4bb3;stroke:none"></path></marker></defs><text x="24" y="10" style="fill:#7b8696;stroke:none;font-size:11px;font-weight:600;font-style:normal;letter-spacing:0.88px;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">DEPTH 0 · SURFACE FEELING</text><text x="318" y="10" style="fill:#7b8696;stroke:none;font-size:11px;font-weight:600;font-style:normal;letter-spacing:0.88px;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">DEPTH 1 · NEED</text><text x="612" y="10" style="fill:#7b8696;stroke:none;font-size:11px;font-weight:600;font-style:normal;letter-spacing:0.88px;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">DEPTH 2 · DEEPER NEED</text><text x="906" y="10" style="fill:#7b8696;stroke:none;font-size:11px;font-weight:600;font-style:normal;letter-spacing:0.88px;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">DEPTH 3 · TERMINAL NEED</text><path d="M260 183C289 183 289 93 318 93" marker-end="url(#graph-mk-best)" style="fill:none;stroke:#2c4bb3;stroke-width:2.4px"></path><path d="M260 183C289 183 289 295 318 295" marker-end="url(#graph-mk)" style="fill:none;stroke:#7b8696;stroke-width:1.3px"></path><path d="M554 93C583 93 583 53 612 53" marker-end="url(#graph-mk-best)" style="fill:none;stroke:#2c4bb3;stroke-width:2.4px"></path><path d="M554 93C583 93 583 159 612 159" marker-end="url(#graph-mk)" style="fill:none;stroke:#7b8696;stroke-width:1.3px"></path><path d="M554 295C583 295 583 295 612 295" marker-end="url(#graph-mk)" style="fill:none;stroke:#7b8696;stroke-width:1.3px"></path><path d="M848 53C877 53 877 53 906 53" marker-end="url(#graph-mk-best)" style="fill:none;stroke:#2c4bb3;stroke-width:2.4px"></path><g><rect x="24" y="150" width="236" height="66" rx="8" style="fill:#faf4ea;stroke:#c3841a;stroke-width:2.6px"></rect><text x="36" y="170" style="fill:#18202c;stroke:none;font-size:13px;font-weight:600;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">feels exhausted</text><text x="36" y="187" style="fill:#c3841a;stroke:none;font-size:11.5px;font-weight:600;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">hypothesis · 0.70</text><text x="36" y="204" style="fill:#7b8696;stroke:none;font-size:11.5px;font-weight:400;font-style:italic;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">“work has just been a lot”</text></g><g><rect x="318" y="60" width="236" height="66" rx="8" style="fill:#ebf4f2;stroke:#1d8a6b;stroke-width:2.6px"></rect><text x="330" y="80" style="fill:#18202c;stroke:none;font-size:13px;font-weight:600;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">their effort goes unseen</text><text x="330" y="97" style="fill:#1d8a6b;stroke:none;font-size:11.5px;font-weight:600;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">confirmed · 0.85</text><text x="330" y="114" style="fill:#7b8696;stroke:none;font-size:11.5px;font-weight:400;font-style:italic;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">“nobody notices what I do”</text></g><g><rect x="318" y="262" width="236" height="66" rx="8" style="fill:#f9edef;stroke:#c03a4a;stroke-width:1.4px"></rect><text x="330" y="282" style="fill:#18202c;stroke:none;font-size:13px;font-weight:600;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">fear of failing</text><text x="330" y="299" style="fill:#c03a4a;stroke:none;font-size:11.5px;font-weight:600;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">denied · blocked for good</text><text x="330" y="316" style="fill:#7b8696;stroke:none;font-size:11.5px;font-weight:400;font-style:italic;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">“no, it's not that at all”</text></g><g><rect x="612" y="20" width="236" height="66" rx="8" style="fill:#faf4ea;stroke:#c3841a;stroke-width:2.6px"></rect><text x="624" y="40" style="fill:#18202c;stroke:none;font-size:13px;font-weight:600;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">need to feel valued at work</text><text x="624" y="57" style="fill:#c3841a;stroke:none;font-size:11.5px;font-weight:600;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">hypothesis · 0.62</text><text x="624" y="74" style="fill:#7b8696;stroke:none;font-size:11.5px;font-weight:400;font-style:italic;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">“I stay late and no one sees”</text></g><g><rect x="612" y="126" width="236" height="66" rx="8" style="fill:#faf4ea;stroke:#c3841a;stroke-width:1.4px"></rect><text x="624" y="146" style="fill:#18202c;stroke:none;font-size:13px;font-weight:600;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">need for rest</text><text x="624" y="163" style="fill:#c3841a;stroke:none;font-size:11.5px;font-weight:600;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">rival · 0.43 (× 0.7)</text><text x="624" y="180" style="fill:#7b8696;stroke:none;font-size:11.5px;font-weight:400;font-style:italic;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">“I'm running on empty”</text></g><g><rect x="612" y="262" width="236" height="66" rx="8" style="fill:#f6f7f8;stroke:#9aa3b0;stroke-width:1.4px;stroke-dasharray:5px, 4px"></rect><text x="624" y="282" style="fill:#18202c;stroke:none;font-size:13px;font-weight:600;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">need to prove themselves</text><text x="624" y="299" style="fill:#9aa3b0;stroke:none;font-size:11.5px;font-weight:600;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">dormant: its premise was denied</text><text x="624" y="316" style="fill:#7b8696;stroke:none;font-size:11.5px;font-weight:400;font-style:italic;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">“I have to show them”</text></g><g><rect x="906" y="20" width="236" height="66" rx="8" style="fill:#faf4ea;stroke:#c3841a;stroke-width:2.6px"></rect><text x="918" y="40" style="fill:#18202c;stroke:none;font-size:13px;font-weight:600;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">need to feel competent</text><text x="918" y="57" style="fill:#c3841a;stroke:none;font-size:11.5px;font-weight:600;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">best guess · 0.48</text><text x="918" y="74" style="fill:#7b8696;stroke:none;font-size:11.5px;font-weight:400;font-style:italic;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">“maybe I'm just not good at this”</text></g><text x="318" y="352" style="fill:#7b8696;stroke:none;font-size:11px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Confirmed needs fade 3× slower. A denial never fades, and the Critic blocks any draft that repeats it.</text><text x="318" y="368" style="fill:#7b8696;stroke:none;font-size:11px;font-weight:400;font-style:normal;letter-spacing:normal;font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Blue path = the chain the brief offers as the best guess. Each quote is a span the code found verbatim in a seeker turn.</text></svg>
